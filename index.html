<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Pastoral de Comunidades</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  #estado {
    position: absolute; z-index: 1000; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #fff; color: #222; padding: 8px 14px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25); font-size: 14px; display: none;
    max-width: 90%; text-align: center;
  }
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .pin span { transform: rotate(45deg); font-size: 15px; line-height: 1; }
  .leyenda {
    background: #fff; color: #222; padding: 8px 12px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25); font-size: 13px; line-height: 1.8;
  }
  .leyenda .dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.35); box-sizing: border-box;
  }
  .visitas {
    background: #fff; color: #222; padding: 6px 10px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25); font-size: 13px;
  }
  .version {
    background: rgba(255,255,255,.85); color: #444; padding: 2px 8px; border-radius: 6px;
    font-size: 11px;
  }
  .btn-ubic {
    background: #fff; color: #222; border: 2px solid rgba(0,0,0,.2); border-radius: 6px;
    padding: 8px 12px; font-size: 14px; cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="estado" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- CAMBIAR: reemplaza comunidadsangabriel por el código que elijas en goatcounter.com (único lugar) -->
<script data-goatcounter="https://comunidadsangabriel.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-OBvvzV18MzUJNvRDnZhaRYsnxkrnoajlEUbWhE2XXhaInnBI3rlcyKsaHsbGO2U63B1GCiLy0Dxz/pub?gid=1365751325&single=true&output=csv";

// CAMBIAR: coordenadas del centro [latitud, longitud]
const CENTRO = [13.8020933495794, -89.1656978691486];
const RADIO_KM = 3;

// Tipos de punto: la "etiqueta" debe coincidir con las opciones del Form
const TIPOS = {
  comunidad: { etiqueta: "Comunidad SVC", emoji: "🏘️", color: "#1f6fb5" },
  escuela:   { etiqueta: "Comunidad SG",  emoji: "🏘️", color: "#d98200" },
  salud:     { etiqueta: "Comunidad SSF", emoji: "🏘️", color: "#d33a3a" },
  otro2:     { etiqueta: "Comunidad SSN", emoji: "🏘️", color: "#297a25" },
  otro:      { etiqueta: "Comunidad SST", emoji: "🏘️", color: "#6f6b73" },
  iglesia:   { etiqueta: "Iglesia",       emoji: "⛪",  color: "#ffffff" }
};
const TIPO_SIN_DATO = "comunidad"; // puntos sin columna "tipo"
// Para valores del Form que no coinciden con ninguna etiqueta (no sale en la leyenda)
const TIPO_DESCONOCIDO = { etiqueta: "Sin clasificar", emoji: "📍", color: "#9aa0a6" };

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(String(v).replace(",", "."));
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "sin-nombre";

// ===== Estadísticas (GoatCounter): no guarda coordenadas ni datos personales =====
function evento(ruta, titulo) {
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: "evento/" + ruta, title: titulo, event: true });
    }
  } catch (e) { /* si el contador falla, el mapa sigue funcionando */ }
}
// Clics en "Cómo llegar"
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[data-ev]");
  if (a) evento(a.dataset.ev, a.dataset.t);
});

const PORETIQUETA = {};
Object.entries(TIPOS).forEach(([k, t]) => { PORETIQUETA[norm(t.etiqueta)] = k; });
function tipoDe(valor) {
  if (!norm(valor)) return TIPOS[TIPO_SIN_DATO];
  return TIPOS[PORETIQUETA[norm(valor)]] || TIPO_DESCONOCIDO;
}
function icono(t) {
  return L.divIcon({
    className: "",
    html: `<div class="pin" style="background:${t.color}"><span>${t.emoji}</span></div>`,
    iconSize: [30, 30], iconAnchor: [15, 36], popupAnchor: [0, -34]
  });
}

const estado = document.getElementById("estado");
function aviso(msg) { estado.textContent = msg; estado.style.display = "block"; }

const map = L.map("map").setView(CENTRO, 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);

const circulo = L.circle(CENTRO, { radius: RADIO_KM * 1000, color: "#d33", fillOpacity: 0.05 }).addTo(map);
map.fitBounds(circulo.getBounds());

const leyenda = L.control({ position: "bottomleft" });
leyenda.onAdd = () => {
  const d = L.DomUtil.create("div", "leyenda");
  d.innerHTML = Object.values(TIPOS).map(t =>
    `<div><span class="dot" style="background:${t.color}"></span>${t.emoji} ${t.etiqueta}</div>`).join("");
  return d;
};
leyenda.addTo(map);

Papa.parse(CSV_URL, {
  download: true, header: true, skipEmptyLines: true,
  complete: ({ data }) => {
    let n = 0;
    data.forEach(p => {
      const lat = num(p.lat), lng = num(p.lng);
      if (isNaN(lat) || isNaN(lng)) return;
      const d = map.distance(CENTRO, [lat, lng]) / 1000;
      if (d > RADIO_KM) return;
      const t = tipoDe(p.tipo);
      const id = slug(p.nombre);
      const m = L.marker([lat, lng], { icon: icono(t) }).addTo(map).bindPopup(
        `<b>${esc(p.nombre)}</b><br>${t.emoji} ${t.etiqueta}<br>${esc(p.desc)}<br>${d.toFixed(1)} km del centro<br>` +
        `<a href="https://www.google.com/maps/dir/?api=1&amp;destination=${lat},${lng}&amp;travelmode=driving" target="_blank" rel="noopener" data-ev="llegar-maps/${id}" data-t="Cómo llegar (Google Maps): ${esc(p.nombre)}">🚗 Cómo llegar</a> · ` +
        `<a href="https://waze.com/ul?ll=${lat},${lng}&amp;navigate=yes" target="_blank" rel="noopener" data-ev="llegar-waze/${id}" data-t="Cómo llegar (Waze): ${esc(p.nombre)}">Waze</a>`);
      m.on("popupopen", () => evento("punto/" + id, "Punto consultado: " + p.nombre));
      n++;
    });
    if (n === 0) aviso("Aún no hay puntos publicados.");
  },
  error: () => aviso("No se pudieron cargar los puntos. Intenta de nuevo más tarde.")
});

// ===== Botón "Mi ubicación" =====
// Zona aproximada: sector (N, NE, E...) + franja de distancia al centro. No se envían coordenadas.
function zonaAprox(latlng) {
  const d = map.distance(CENTRO, latlng) / 1000;
  if (d > 10) return "Fuera de zona (más de 10 km)";
  if (d < 1) return "Cerca del centro (menos de 1 km)";
  const dy = latlng.lat - CENTRO[0];
  const dx = (latlng.lng - CENTRO[1]) * Math.cos(CENTRO[0] * Math.PI / 180);
  const ang = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360; // 0 = norte
  const sector = ["Norte","Noreste","Este","Sureste","Sur","Suroeste","Oeste","Noroeste"][Math.round(ang / 45) % 8];
  const banda = d <= RADIO_KM ? `1 a ${RADIO_KM} km` : `${RADIO_KM} a 10 km`;
  return `${sector}, ${banda}`;
}

let marcaUsuario, precision, zonaEnviada = false;
const BtnUbic = L.control({ position: "topleft" });
BtnUbic.onAdd = () => {
  const b = L.DomUtil.create("button", "btn-ubic");
  b.type = "button";
  b.textContent = "📍 Mi ubicación";
  L.DomEvent.disableClickPropagation(b);
  b.onclick = () => map.locate({ setView: true, maxZoom: 15, enableHighAccuracy: true });
  return b;
};
BtnUbic.addTo(map);

map.on("locationfound", e => {
  if (marcaUsuario) { map.removeLayer(marcaUsuario); map.removeLayer(precision); }
  precision = L.circle(e.latlng, { radius: e.accuracy, color: "#1a73e8", weight: 1, fillOpacity: 0.1 }).addTo(map);
  marcaUsuario = L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 2, fillColor: "#1a73e8", fillOpacity: 1 })
    .addTo(map).bindPopup("Estás aquí").openPopup();
  const d = map.distance(CENTRO, e.latlng) / 1000;
  let msg = d <= RADIO_KM
    ? `Estás a ${d.toFixed(1)} km del centro, dentro del radio.`
    : `Estás a ${d.toFixed(1)} km del centro, fuera del radio de ${RADIO_KM} km.`;
  // Solo se registra si la ubicación es razonablemente precisa y una vez por visita
  if (!zonaEnviada && e.accuracy <= 1000) {
    const z = zonaAprox(e.latlng);
    evento("zona/" + slug(z), "Zona: " + z);
    zonaEnviada = true;
    msg += " Se registra solo tu zona aproximada, sin coordenadas, para estadísticas.";
  }
  aviso(msg);
  setTimeout(() => { estado.style.display = "none"; }, 7000);
});
map.on("locationerror", () => aviso("No se pudo obtener tu ubicación. Revisa los permisos del navegador."));

// ===== Contador público: "Visitantes de esta página: n" =====
const GC_BASE = (document.querySelector("script[data-goatcounter]")?.dataset.goatcounter || "").replace(/\/count$/, "");
const Visitas = L.control({ position: "topright" });
Visitas.onAdd = () => {
  const d = L.DomUtil.create("div", "visitas");
  d.id = "visitas"; d.style.display = "none";
  return d;
};
Visitas.addTo(map);
// Prueba varias formas de la ruta (GoatCounter exige la ruta exacta con que guardó la visita)
async function contarVisitas() {
  if (!GC_BASE) return;
  // Espera hasta 3 s a que cargue count.js para leer la ruta exacta que envía
  for (let i = 0; i < 30 && !(window.goatcounter && window.goatcounter.get_data); i++) {
    await new Promise(r => setTimeout(r, 100));
  }
  const candidatos = [];
  try { const p = window.goatcounter.get_data().p; if (p) candidatos.push(p); } catch (e) {}
  candidatos.push(location.pathname);
  if (location.pathname.length > 1) candidatos.push(location.pathname.replace(/\/+$/, ""));
  for (const c of Array.from(new Set(candidatos))) {
    try {
      const r = await fetch(GC_BASE + "/counter/" + encodeURIComponent(c) + ".json?start=2020-01-01", { cache: "no-store" });
      if (!r.ok) continue;
      const j = await r.json();
      const el = document.getElementById("visitas");
      el.textContent = "Visitantes de esta página: " + j.count;
      el.style.display = "block";
      return;
    } catch (e) { /* prueba la siguiente forma */ }
  }
  console.info("Contador de visitas sin datos para:", candidatos);
}
contarVisitas();

// ===== Versión de la página =====
// Sube VERSION cada vez que cambies el archivo. La fecha y hora se leen solas del servidor.
const VERSION = "v1.3";
const FECHA_RESPALDO = "2026-11-27 15:13"; // hora de El Salvador cuando se generó este archivo
function fechaPublicacion() {
  const lm = new Date(document.lastModified);
  // Si el servidor no envía fecha, el navegador devuelve "ahora": en ese caso se usa la de respaldo
  const sinDato = isNaN(lm) || Math.abs(Date.now() - lm.getTime()) < 3000;
  if (sinDato) return FECHA_RESPALDO + " (aprox.)";
  try {
    return new Intl.DateTimeFormat("es", {
      timeZone: "America/El_Salvador", day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).format(lm);
  } catch (e) { return lm.toLocaleString(); }
}
const Version = L.control({ position: "bottomright" });
Version.onAdd = () => {
  const d = L.DomUtil.create("div", "version");
  d.textContent = VERSION + " · " + fechaPublicacion();
  d.title = "Versión y fecha de la última publicación";
  return d;
};
Version.addTo(map);
</script>

</body>
</html>
